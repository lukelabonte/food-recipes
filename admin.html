<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
    <meta name="robots" content="noindex, nofollow">
    <style>
        .admin-page {
            max-width: 640px;
            margin: 0 auto;
        }
        .admin-page .header-card {
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            margin-bottom: 0.65rem;
        }

        /* Form layout (shared with request-access / upload) */
        .form-group { margin-bottom: 1.25rem; }
        .form-group:last-child { margin-bottom: 0; }
        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 0.35rem;
        }
        .form-input {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1px solid var(--color-border);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--color-text);
            background: var(--color-bg);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            -webkit-appearance: none;
            min-height: 44px;
        }
        .form-input::placeholder { color: var(--color-text-muted); }
        .form-input:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px var(--color-accent-focus);
        }
        .submit-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.75rem 1.5rem;
            background: var(--color-accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s ease;
            min-height: 48px;
            -webkit-tap-highlight-color: rgba(0,0,0,0.05);
        }
        .submit-btn:hover { background: var(--color-accent-hover); }
        .submit-btn:active { opacity: 0.85; }

        /* Status feedback */
        .admin-status {
            margin-top: 0.75rem;
            padding: 0.65rem 0.85rem;
            border-radius: 10px;
            font-size: 0.88rem;
            line-height: 1.45;
            display: none;
        }
        .admin-status.visible { display: block; }
        /* .status-success, .status-error, .status-processing defined in shared style.css */

        /* Actions row */
        .admin-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0.25rem;
            margin-bottom: 0.75rem;
        }
        .admin-actions a {
            font-size: 0.9rem;
        }
        .admin-sign-out {
            background: none;
            border: none;
            font-size: 0.9rem;
            color: var(--color-accent);
            cursor: pointer;
            font-family: inherit;
            padding: 0;
        }
        .admin-sign-out:hover { color: var(--color-accent-hover); }

        /* Section header with count */
        .admin-section-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0;
        }
        .admin-section-header h2 {
            margin: 0;
            font-size: 1.1rem;
        }
        .admin-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 1.4rem;
            height: 1.4rem;
            padding: 0 0.4rem;
            border-radius: 99px;
            background: var(--color-surface-alt);
            color: var(--color-accent);
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Collapsible users section */
        .admin-collapsible {
            border: none;
            padding: 0;
        }
        .admin-section-toggle {
            list-style: none;
            cursor: pointer;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .admin-section-toggle::-webkit-details-marker { display: none; }
        .admin-section-toggle::after {
            content: '\25B8';
            font-size: 0.85rem;
            color: var(--color-text-muted);
            transition: transform 0.15s ease;
        }
        .admin-collapsible[open] .admin-section-toggle::after {
            transform: rotate(90deg);
        }
        .admin-collapsible-content {
            padding: 0 1.25rem 1rem;
        }

        /* Request / user cards */
        .admin-card {
            padding: 0.85rem 0;
            border-bottom: 1px solid var(--color-surface-alt);
            transition: opacity 0.3s ease;
        }
        .admin-card:last-child { border-bottom: none; }
        .admin-card-name {
            font-weight: 600;
            color: var(--color-text);
            font-size: 0.95rem;
        }
        .admin-card-contact {
            color: var(--color-accent);
            font-size: 0.85rem;
            margin-top: 0.15rem;
        }
        .admin-card-message {
            color: var(--color-text-muted);
            font-style: italic;
            font-size: 0.85rem;
            margin-top: 0.3rem;
            line-height: 1.4;
        }
        .admin-card-date {
            color: var(--color-text-muted);
            font-size: 0.78rem;
            margin-top: 0.25rem;
        }
        .admin-card-passphrase {
            font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
            font-size: 0.82rem;
            color: var(--color-text-muted);
            margin-top: 0.15rem;
        }

        /* Button row */
        .admin-card-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.6rem;
            flex-wrap: wrap;
        }

        /* Shared button base */
        .admin-btn {
            border: none;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            padding: 0.45rem 0.85rem;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease, opacity 0.15s ease;
            -webkit-tap-highlight-color: rgba(0,0,0,0.05);
        }
        .admin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .admin-btn-approve {
            background: var(--color-accent);
            color: #fff;
            flex: 1;
        }
        .admin-btn-approve:hover:not(:disabled) { background: var(--color-accent-hover); }
        .admin-btn-dismiss {
            background: var(--color-surface-alt);
            color: var(--color-text-muted);
        }
        .admin-btn-dismiss:hover:not(:disabled) { background: var(--color-border); color: var(--color-text); }
        .admin-btn-copy {
            background: var(--color-surface-alt);
            color: var(--color-accent);
            font-size: 0.78rem;
            padding: 0.3rem 0.6rem;
            min-height: 36px;
        }
        .admin-btn-copy:hover:not(:disabled) { background: var(--color-border); }
        .admin-btn-remove {
            background: none;
            color: var(--color-error);
            border: 1px solid var(--color-error);
            font-size: 0.78rem;
            padding: 0.3rem 0.6rem;
            min-height: 36px;
        }
        .admin-btn-remove:hover:not(:disabled) { background: #fdf0f0; }
        @media (prefers-color-scheme: dark) {
            .admin-btn-remove:hover:not(:disabled) { background: #2e1a1a; }
        }
        html[data-theme="dark"] .admin-btn-remove:hover:not(:disabled) { background: #2e1a1a; }
        html[data-theme="light"] .admin-btn-remove:hover:not(:disabled) { background: #fdf0f0; }

        /* Inline confirmation */
        .admin-confirm {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            padding: 0.5rem 0.65rem;
            background: #fdf0f0;
            border: 1px solid var(--color-error);
            border-radius: 8px;
            font-size: 0.82rem;
            color: var(--color-error);
        }
        @media (prefers-color-scheme: dark) {
            .admin-confirm { background: #2e1a1a; }
        }
        html[data-theme="dark"] .admin-confirm { background: #2e1a1a; }
        html[data-theme="light"] .admin-confirm { background: #fdf0f0; }
        .admin-confirm-text { flex: 1; }
        .admin-confirm-yes {
            background: var(--color-error);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.3rem 0.6rem;
            font-size: 0.78rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            min-height: 36px;
        }
        .admin-confirm-cancel {
            background: none;
            border: none;
            color: var(--color-text-muted);
            font-size: 0.78rem;
            font-family: inherit;
            cursor: pointer;
            padding: 0.3rem 0.4rem;
            min-height: 36px;
        }

        /* Inline status on cards */
        .admin-card-status {
            margin-top: 0.5rem;
            padding: 0.45rem 0.65rem;
            border-radius: 8px;
            font-size: 0.82rem;
            line-height: 1.4;
        }

        /* Empty state */
        .admin-empty {
            text-align: center;
            color: var(--color-text-muted);
            font-size: 0.88rem;
            padding: 1.5rem 0;
        }

        /* Inline passphrase input row */
        .admin-passphrase-row {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.6rem;
            align-items: center;
        }
        .admin-passphrase-input {
            flex: 1;
            padding: 0.45rem 0.65rem;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-size: 0.88rem;
            font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
            color: var(--color-text);
            background: var(--color-bg);
            outline: none;
            min-height: 44px;
            -webkit-appearance: none;
        }
        .admin-passphrase-input:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px var(--color-accent-focus);
        }
        .admin-passphrase-input::placeholder { color: var(--color-text-muted); }

        /* Fade-out for dismissed/removed cards */
        .admin-card-fading {
            opacity: 0;
            pointer-events: none;
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .form-input,
            .submit-btn,
            .admin-btn,
            .admin-card,
            .admin-section-toggle::after { transition: none; }
        }

        /* Print: hide everything */
        @media print {
            body { display: none; }
        }
    </style>
    <script src="assets/theme.js" defer></script>
</head>
<body>
    <div class="admin-page">
        <!-- Auth gate -->
        <div id="auth-gate">
            <div class="card header-card">
                <h1>Admin</h1>
                <p class="subtitle">Manage access requests and users</p>
            </div>

            <div class="admin-actions">
                <a href="/" class="back-link" style="padding:0;">&larr; Back to Recipes</a>
            </div>

            <form id="auth-form" class="card">
                <div class="form-group">
                    <label class="form-label" for="admin-secret">Admin Secret</label>
                    <input class="form-input" type="password" id="admin-secret" required autocomplete="off" placeholder="Enter admin secret">
                </div>
                <button type="submit" class="submit-btn">Sign In</button>
                <div id="auth-status" class="admin-status"></div>
            </form>
        </div>

        <!-- Dashboard (hidden until authenticated) -->
        <div id="dashboard" style="display:none;">
            <div class="card header-card">
                <h1>Admin</h1>
                <p class="subtitle" id="dashboard-subtitle">Loading...</p>
            </div>

            <div class="admin-actions">
                <a href="/" class="back-link" style="padding:0;">&larr; Back to Recipes</a>
                <button class="admin-sign-out" id="sign-out-btn">Sign Out</button>
            </div>

            <!-- Access Requests -->
            <div class="card" id="requests-section">
                <div class="admin-section-header">
                    <h2>Access Requests</h2>
                    <span class="admin-count" id="requests-count">0</span>
                </div>
                <div id="requests-list"></div>
            </div>

            <!-- Users (collapsible) -->
            <details class="card admin-collapsible" id="users-section">
                <summary class="admin-section-toggle">
                    <div class="admin-section-header">
                        <h2>Users</h2>
                        <span class="admin-count" id="users-count">0</span>
                    </div>
                </summary>
                <div class="admin-collapsible-content" id="users-list"></div>
            </details>

            <a href="/" class="back-link">&larr; Back to Recipes</a>
        </div>
    </div>

    <script>
        const API_BASE = 'https://recipe-upload.lukelabonte.workers.dev';
        const SESSION_KEY = 'admin-secret';

        // ── Helpers ──────────────────────────────────────

        function getSecret() {
            return sessionStorage.getItem(SESSION_KEY);
        }

        async function api(method, path, body) {
            const headers = { 'X-Admin-Secret': getSecret() };
            if (body) headers['Content-Type'] = 'application/json';
            const opts = { method, headers };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(API_BASE + path, opts);
            let data;
            try {
                data = await res.json();
            } catch {
                data = { error: 'Unexpected response from server' };
            }
            return { status: res.status, data };
        }

        function relativeDate(iso) {
            const diff = Date.now() - new Date(iso).getTime();
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return 'just now';
            if (mins < 60) return mins + 'm ago';
            const hrs = Math.floor(mins / 60);
            if (hrs < 24) return hrs + 'h ago';
            const days = Math.floor(hrs / 24);
            if (days < 30) return days + 'd ago';
            return new Date(iso).toLocaleDateString();
        }

        function clearChildren(node) {
            while (node.firstChild) node.removeChild(node.firstChild);
        }

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text) node.textContent = text;
            return node;
        }

        // ── Auth ─────────────────────────────────────────

        const authGate = document.getElementById('auth-gate');
        const dashboard = document.getElementById('dashboard');
        const authForm = document.getElementById('auth-form');
        const authStatus = document.getElementById('auth-status');

        authForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const secret = document.getElementById('admin-secret').value.trim();
            if (!secret) return;

            authStatus.className = 'admin-status status-processing visible';
            authStatus.textContent = 'Verifying\u2026';
            this.querySelector('.submit-btn').disabled = true;

            sessionStorage.setItem(SESSION_KEY, secret);
            const result = await tryAuth();
            if (result !== true) {
                sessionStorage.removeItem(SESSION_KEY);
                authStatus.className = 'admin-status status-error visible';
                authStatus.textContent = result === 'network-error'
                    ? 'Could not reach the server. Check your connection or try again.'
                    : 'Invalid admin secret.';
                this.querySelector('.submit-btn').disabled = false;
            }
        });

        async function tryAuth() {
            try {
                const res = await api('GET', '/admin/requests');
                if (res.status === 403 || res.status === 401) return false;
                if (res.status >= 400) return false;
                showDashboard(res.data.requests || []);
                return true;
            } catch (err) {
                // CORS or network errors surface as TypeError from fetch
                if (err && err.message) {
                    console.error('Auth check failed:', err.message);
                }
                return 'network-error';
            }
        }

        // Check for existing session on load
        if (getSecret()) {
            tryAuth().then(result => {
                if (result !== true) sessionStorage.removeItem(SESSION_KEY);
            });
        }

        // ── Dashboard ────────────────────────────────────

        function showDashboard(requests) {
            authGate.style.display = 'none';
            dashboard.style.display = '';
            renderRequests(requests);
            // Fetch users in parallel
            api('GET', '/admin/users').then(res => {
                renderUsers(res.data.users || []);
            });
        }

        // Sign out
        document.getElementById('sign-out-btn').addEventListener('click', function() {
            sessionStorage.removeItem(SESSION_KEY);
            location.reload();
        });

        // ── Requests ─────────────────────────────────────

        function renderRequests(requests) {
            const list = document.getElementById('requests-list');
            clearChildren(list);

            requests.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            if (requests.length === 0) {
                list.appendChild(el('p', 'admin-empty', 'No pending requests'));
                updateCounts();
                return;
            }

            requests.forEach(req => {
                const card = el('div', 'admin-card');
                card.dataset.id = req.id;

                card.appendChild(el('div', 'admin-card-name', req.name));
                if (req.contact) card.appendChild(el('div', 'admin-card-contact', req.contact));
                if (req.message) card.appendChild(el('div', 'admin-card-message', '\u201C' + req.message + '\u201D'));
                if (req.createdAt) card.appendChild(el('div', 'admin-card-date', relativeDate(req.createdAt)));

                const buttons = el('div', 'admin-card-buttons');
                const approveBtn = el('button', 'admin-btn admin-btn-approve', 'Approve');
                const dismissBtn = el('button', 'admin-btn admin-btn-dismiss', 'Dismiss');
                buttons.appendChild(approveBtn);
                buttons.appendChild(dismissBtn);
                card.appendChild(buttons);

                approveBtn.addEventListener('click', () => handleApprove(req, card, approveBtn, dismissBtn));
                dismissBtn.addEventListener('click', () => handleDismiss(req, card, approveBtn, dismissBtn));

                list.appendChild(card);
            });

            updateCounts();
        }

        function handleApprove(req, card, approveBtn, dismissBtn) {
            // Toggle: if passphrase row already showing, remove it
            const existing = card.querySelector('.admin-passphrase-row');
            if (existing) { existing.remove(); return; }

            // Show inline passphrase input
            const row = el('div', 'admin-passphrase-row');
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'admin-passphrase-input';
            input.placeholder = 'Choose a passphrase\u2026';
            input.autocomplete = 'off';
            row.appendChild(input);

            const confirmBtn = el('button', 'admin-btn admin-btn-approve', 'Confirm');
            row.appendChild(confirmBtn);

            const cancelBtn = el('button', 'admin-btn admin-btn-dismiss', 'Cancel');
            cancelBtn.addEventListener('click', () => row.remove());
            row.appendChild(cancelBtn);

            confirmBtn.addEventListener('click', () => submitApproval(req, card, input, confirmBtn, cancelBtn, row));
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') submitApproval(req, card, input, confirmBtn, cancelBtn, row);
            });

            card.appendChild(row);
            input.focus();
        }

        async function submitApproval(req, card, input, confirmBtn, cancelBtn, row) {
            const passphrase = input.value.trim();
            if (!passphrase) { input.focus(); return; }

            confirmBtn.disabled = true;
            cancelBtn.disabled = true;
            input.disabled = true;
            confirmBtn.textContent = 'Creating\u2026';

            try {
                const userRes = await api('POST', '/admin/users', {
                    displayName: req.name,
                    passphrase,
                    email: req.contact || undefined
                });

                if (userRes.status >= 400) {
                    showCardStatus(card, 'error', userRes.data.error || 'Failed to create user.');
                    confirmBtn.disabled = false;
                    cancelBtn.disabled = false;
                    input.disabled = false;
                    confirmBtn.textContent = 'Confirm';
                    return;
                }

                // Delete the request
                await api('DELETE', '/admin/requests/' + encodeURIComponent(req.id));

                // Show success
                const emailSent = userRes.data.emailSent;
                row.remove();
                const oldButtons = card.querySelector('.admin-card-buttons');
                if (oldButtons) oldButtons.remove();

                function fadeOutCard() {
                    card.classList.add('admin-card-fading');
                    setTimeout(() => {
                        card.remove();
                        updateCounts();
                    }, 300);
                }

                if (emailSent) {
                    showCardStatus(card, 'success', 'Approved! Passphrase sent to ' + (req.contact || 'email') + '.');
                    setTimeout(fadeOutCard, 3000);
                } else {
                    showCardStatus(card, 'success', 'Approved! Copy the passphrase from the Users section below.');
                    setTimeout(fadeOutCard, 4000);
                }

                // Refresh users
                api('GET', '/admin/users').then(res => renderUsers(res.data.users || []));

            } catch (err) {
                showCardStatus(card, 'error', 'Network error. Please try again.');
                confirmBtn.disabled = false;
                cancelBtn.disabled = false;
                input.disabled = false;
                confirmBtn.textContent = 'Confirm';
            }
        }

        async function handleDismiss(req, card, approveBtn, dismissBtn) {
            approveBtn.disabled = true;
            dismissBtn.disabled = true;
            dismissBtn.textContent = 'Dismissing\u2026';

            try {
                const res = await api('DELETE', '/admin/requests/' + encodeURIComponent(req.id));
                if (res.status >= 400) {
                    showCardStatus(card, 'error', res.data.error || 'Failed to dismiss.');
                    approveBtn.disabled = false;
                    dismissBtn.disabled = false;
                    dismissBtn.textContent = 'Dismiss';
                    return;
                }
                card.classList.add('admin-card-fading');
                setTimeout(() => {
                    card.remove();
                    updateCounts();
                }, 300);
            } catch {
                showCardStatus(card, 'error', 'Network error.');
                approveBtn.disabled = false;
                dismissBtn.disabled = false;
                dismissBtn.textContent = 'Dismiss';
            }
        }

        function showCardStatus(card, type, text) {
            let status = card.querySelector('.admin-card-status');
            if (!status) {
                status = el('div', 'admin-card-status');
                card.appendChild(status);
            }
            status.className = 'admin-card-status status-' + type;
            status.textContent = text;
        }

        // ── Users ────────────────────────────────────────

        function renderUsers(users) {
            const list = document.getElementById('users-list');
            clearChildren(list);

            users.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            if (users.length === 0) {
                list.appendChild(el('p', 'admin-empty', 'No users yet'));
                updateCounts();
                return;
            }

            users.forEach(user => {
                const card = el('div', 'admin-card');
                card.dataset.passphrase = user.passphrase;

                card.appendChild(el('div', 'admin-card-name', user.displayName));
                card.appendChild(el('div', 'admin-card-passphrase', user.passphrase));
                if (user.createdAt) card.appendChild(el('div', 'admin-card-date', relativeDate(user.createdAt)));

                const buttons = el('div', 'admin-card-buttons');
                const copyBtn = el('button', 'admin-btn admin-btn-copy', 'Copy Passphrase');
                copyBtn.addEventListener('click', () => copyToClipboard(user.passphrase, copyBtn));
                buttons.appendChild(copyBtn);

                const changeBtn = el('button', 'admin-btn admin-btn-copy', 'Change');
                changeBtn.addEventListener('click', () => showChangePassphrase(user, card));
                buttons.appendChild(changeBtn);

                const removeBtn = el('button', 'admin-btn admin-btn-remove', 'Remove');
                removeBtn.addEventListener('click', () => showRemoveConfirm(user, card));
                buttons.appendChild(removeBtn);

                card.appendChild(buttons);
                list.appendChild(card);
            });

            updateCounts();
        }

        function showRemoveConfirm(user, card) {
            // Toggle existing confirmation
            const existing = card.querySelector('.admin-confirm');
            if (existing) { existing.remove(); return; }

            const confirm = el('div', 'admin-confirm');
            confirm.appendChild(el('span', 'admin-confirm-text', 'Remove ' + user.displayName + '?'));

            const yesBtn = el('button', 'admin-confirm-yes', 'Yes, Remove');
            yesBtn.addEventListener('click', async () => {
                yesBtn.disabled = true;
                yesBtn.textContent = 'Removing\u2026';
                try {
                    const res = await api('DELETE', '/admin/users/' + encodeURIComponent(user.passphrase));
                    if (res.status >= 400) {
                        showCardStatus(card, 'error', res.data.error || 'Failed to remove.');
                        confirm.remove();
                        return;
                    }
                    card.classList.add('admin-card-fading');
                    setTimeout(() => {
                        card.remove();
                        updateCounts();
                    }, 300);
                } catch {
                    showCardStatus(card, 'error', 'Network error.');
                    confirm.remove();
                }
            });
            confirm.appendChild(yesBtn);

            const cancelBtn = el('button', 'admin-confirm-cancel', 'Cancel');
            cancelBtn.addEventListener('click', () => confirm.remove());
            confirm.appendChild(cancelBtn);

            card.appendChild(confirm);
        }

        // ── Change Passphrase ───────────────────────

        function showChangePassphrase(user, card) {
            // Toggle existing input
            const existing = card.querySelector('.admin-passphrase-row');
            if (existing) { existing.remove(); return; }

            const row = el('div', 'admin-passphrase-row');
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'admin-passphrase-input';
            input.placeholder = 'New passphrase\u2026';
            input.autocomplete = 'off';
            row.appendChild(input);

            const saveBtn = el('button', 'admin-btn admin-btn-approve', 'Save');
            row.appendChild(saveBtn);

            const cancelBtn = el('button', 'admin-btn admin-btn-dismiss', 'Cancel');
            cancelBtn.addEventListener('click', () => row.remove());
            row.appendChild(cancelBtn);

            async function doChange() {
                const newPassphrase = input.value.trim();
                if (!newPassphrase) { input.focus(); return; }

                saveBtn.disabled = true;
                cancelBtn.disabled = true;
                input.disabled = true;
                saveBtn.textContent = 'Saving\u2026';

                try {
                    const res = await api('PUT', '/admin/users/' + encodeURIComponent(user.passphrase), {
                        newPassphrase
                    });

                    if (res.status >= 400) {
                        showCardStatus(card, 'error', res.data.error || 'Failed to change passphrase.');
                        saveBtn.disabled = false;
                        cancelBtn.disabled = false;
                        input.disabled = false;
                        saveBtn.textContent = 'Save';
                        return;
                    }

                    row.remove();
                    showCardStatus(card, 'success', 'Passphrase changed!');

                    // Refresh users to show updated passphrase
                    setTimeout(() => {
                        const status = card.querySelector('.admin-card-status');
                        if (status) status.remove();
                        api('GET', '/admin/users').then(r => renderUsers(r.data.users || []));
                    }, 1500);

                } catch {
                    showCardStatus(card, 'error', 'Network error.');
                    saveBtn.disabled = false;
                    cancelBtn.disabled = false;
                    input.disabled = false;
                    saveBtn.textContent = 'Save';
                }
            }

            saveBtn.addEventListener('click', doChange);
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doChange(); });

            card.appendChild(row);
            input.focus();
        }

        // ── Clipboard ────────────────────────────────────

        function copyToClipboard(text, btn) {
            const original = btn.textContent;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    btn.textContent = 'Copied!';
                    setTimeout(() => { btn.textContent = original; }, 1500);
                }).catch(() => {
                    prompt('Copy this passphrase:', text);
                });
            } else {
                prompt('Copy this passphrase:', text);
            }
        }

        // ── Counts ───────────────────────────────────────

        function updateCounts() {
            const reqCards = document.querySelectorAll('#requests-list .admin-card:not(.admin-card-fading)');
            const userCards = document.querySelectorAll('#users-list .admin-card:not(.admin-card-fading)');
            const reqCount = reqCards.length;
            const userCount = userCards.length;

            document.getElementById('requests-count').textContent = reqCount;
            document.getElementById('users-count').textContent = userCount;

            const subtitle = document.getElementById('dashboard-subtitle');
            const parts = [];
            if (reqCount > 0) parts.push(reqCount + ' pending request' + (reqCount !== 1 ? 's' : ''));
            if (userCount > 0) parts.push(userCount + ' user' + (userCount !== 1 ? 's' : ''));
            subtitle.textContent = parts.length ? parts.join(' \u00B7 ') : 'No requests or users';

            // Show empty states if no cards remain
            const reqList = document.getElementById('requests-list');
            if (reqCount === 0 && !reqList.querySelector('.admin-empty')) {
                clearChildren(reqList);
                reqList.appendChild(el('p', 'admin-empty', 'No pending requests'));
            }
            const userList = document.getElementById('users-list');
            if (userCount === 0 && !userList.querySelector('.admin-empty')) {
                clearChildren(userList);
                userList.appendChild(el('p', 'admin-empty', 'No users yet'));
            }
        }
    </script>
</body>
</html>
