<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
    <meta name="robots" content="noindex, nofollow">
    <style>
        .admin-page {
            max-width: 640px;
            margin: 0 auto;
        }
        .admin-page .header-card {
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            margin-bottom: 0.65rem;
        }

        /* Form layout (shared with request-access / upload) */
        .form-group { margin-bottom: 1.25rem; }
        .form-group:last-child { margin-bottom: 0; }
        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #3d3d3d;
            margin-bottom: 0.35rem;
        }
        .form-input {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1px solid #e0d6c8;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #3d3d3d;
            background: #faf8f5;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            -webkit-appearance: none;
            min-height: 44px;
        }
        .form-input::placeholder { color: #c4b8a8; }
        .form-input:focus {
            border-color: #9a7b5b;
            box-shadow: 0 0 0 3px rgba(154, 123, 91, 0.12);
        }
        .submit-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.75rem 1.5rem;
            background: #9a7b5b;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s ease;
            min-height: 48px;
            -webkit-tap-highlight-color: rgba(0,0,0,0.05);
        }
        .submit-btn:hover { background: #7a5f43; }
        .submit-btn:active { opacity: 0.85; }

        /* Status feedback */
        .admin-status {
            margin-top: 0.75rem;
            padding: 0.65rem 0.85rem;
            border-radius: 10px;
            font-size: 0.88rem;
            line-height: 1.45;
            display: none;
        }
        .admin-status.visible { display: block; }
        .status-success {
            background: #f0f9f0;
            color: #3a7d3a;
            border: 1px solid #c8e6c8;
        }
        .status-error {
            background: #fdf0f0;
            color: #c44;
            border: 1px solid #f0c8c8;
        }
        .status-processing {
            background: #f5f3f0;
            color: #888;
            border: 1px solid #e0d6c8;
        }

        /* Actions row */
        .admin-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0.25rem;
            margin-bottom: 0.75rem;
        }
        .admin-actions a {
            font-size: 0.9rem;
        }
        .admin-sign-out {
            background: none;
            border: none;
            font-size: 0.9rem;
            color: #9a7b5b;
            cursor: pointer;
            font-family: inherit;
            padding: 0;
        }
        .admin-sign-out:hover { color: #7a5f43; }

        /* Section header with count */
        .admin-section-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0;
        }
        .admin-section-header h2 {
            margin: 0;
            font-size: 1.1rem;
        }
        .admin-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 1.4rem;
            height: 1.4rem;
            padding: 0 0.4rem;
            border-radius: 99px;
            background: #f0ece6;
            color: #9a7b5b;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Collapsible users section */
        .admin-collapsible {
            border: none;
            padding: 0;
        }
        .admin-section-toggle {
            list-style: none;
            cursor: pointer;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .admin-section-toggle::-webkit-details-marker { display: none; }
        .admin-section-toggle::after {
            content: '\25B8';
            font-size: 0.85rem;
            color: #bbb;
            transition: transform 0.15s ease;
        }
        .admin-collapsible[open] .admin-section-toggle::after {
            transform: rotate(90deg);
        }
        .admin-collapsible-content {
            padding: 0 1.25rem 1rem;
        }

        /* Request / user cards */
        .admin-card {
            padding: 0.85rem 0;
            border-bottom: 1px solid #f0ece6;
            transition: opacity 0.3s ease;
        }
        .admin-card:last-child { border-bottom: none; }
        .admin-card-name {
            font-weight: 600;
            color: #3d3d3d;
            font-size: 0.95rem;
        }
        .admin-card-contact {
            color: #9a7b5b;
            font-size: 0.85rem;
            margin-top: 0.15rem;
        }
        .admin-card-message {
            color: #999;
            font-style: italic;
            font-size: 0.85rem;
            margin-top: 0.3rem;
            line-height: 1.4;
        }
        .admin-card-date {
            color: #ccc;
            font-size: 0.78rem;
            margin-top: 0.25rem;
        }
        .admin-card-passphrase {
            font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
            font-size: 0.82rem;
            color: #888;
            margin-top: 0.15rem;
        }

        /* Button row */
        .admin-card-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.6rem;
            flex-wrap: wrap;
        }

        /* Shared button base */
        .admin-btn {
            border: none;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            padding: 0.45rem 0.85rem;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease, opacity 0.15s ease;
            -webkit-tap-highlight-color: rgba(0,0,0,0.05);
        }
        .admin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .admin-btn-approve {
            background: #9a7b5b;
            color: #fff;
            flex: 1;
        }
        .admin-btn-approve:hover:not(:disabled) { background: #7a5f43; }
        .admin-btn-dismiss {
            background: #f0ece6;
            color: #888;
        }
        .admin-btn-dismiss:hover:not(:disabled) { background: #e6dfd5; color: #666; }
        .admin-btn-copy {
            background: #f0ece6;
            color: #9a7b5b;
            font-size: 0.78rem;
            padding: 0.3rem 0.6rem;
            min-height: 36px;
        }
        .admin-btn-copy:hover:not(:disabled) { background: #e6dfd5; }
        .admin-btn-remove {
            background: none;
            color: #c44;
            border: 1px solid #f0c8c8;
            font-size: 0.78rem;
            padding: 0.3rem 0.6rem;
            min-height: 36px;
        }
        .admin-btn-remove:hover:not(:disabled) { background: #fdf0f0; }

        /* Inline confirmation */
        .admin-confirm {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            padding: 0.5rem 0.65rem;
            background: #fdf0f0;
            border: 1px solid #f0c8c8;
            border-radius: 8px;
            font-size: 0.82rem;
            color: #c44;
        }
        .admin-confirm-text { flex: 1; }
        .admin-confirm-yes {
            background: #c44;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.3rem 0.6rem;
            font-size: 0.78rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            min-height: 36px;
        }
        .admin-confirm-cancel {
            background: none;
            border: none;
            color: #999;
            font-size: 0.78rem;
            font-family: inherit;
            cursor: pointer;
            padding: 0.3rem 0.4rem;
            min-height: 36px;
        }

        /* Inline status on cards */
        .admin-card-status {
            margin-top: 0.5rem;
            padding: 0.45rem 0.65rem;
            border-radius: 8px;
            font-size: 0.82rem;
            line-height: 1.4;
        }

        /* Empty state */
        .admin-empty {
            text-align: center;
            color: #ccc;
            font-size: 0.88rem;
            padding: 1.5rem 0;
        }

        /* Fade-out for dismissed/removed cards */
        .admin-card-fading {
            opacity: 0;
            pointer-events: none;
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .form-input,
            .submit-btn,
            .admin-btn,
            .admin-card,
            .admin-section-toggle::after { transition: none; }
        }

        /* Print: hide everything */
        @media print {
            body { display: none; }
        }
    </style>
</head>
<body>
    <div class="admin-page">
        <!-- Auth gate -->
        <div id="auth-gate">
            <div class="card header-card">
                <h1>Admin</h1>
                <p class="subtitle">Manage access requests and users</p>
            </div>

            <div class="admin-actions">
                <a href="/" class="back-link" style="padding:0;">&larr; Back to Recipes</a>
            </div>

            <form id="auth-form" class="card">
                <div class="form-group">
                    <label class="form-label" for="admin-secret">Admin Secret</label>
                    <input class="form-input" type="password" id="admin-secret" required autocomplete="off" placeholder="Enter admin secret">
                </div>
                <button type="submit" class="submit-btn">Sign In</button>
                <div id="auth-status" class="admin-status"></div>
            </form>
        </div>

        <!-- Dashboard (hidden until authenticated) -->
        <div id="dashboard" style="display:none;">
            <div class="card header-card">
                <h1>Admin</h1>
                <p class="subtitle" id="dashboard-subtitle">Loading...</p>
            </div>

            <div class="admin-actions">
                <a href="/" class="back-link" style="padding:0;">&larr; Back to Recipes</a>
                <button class="admin-sign-out" id="sign-out-btn">Sign Out</button>
            </div>

            <!-- Access Requests -->
            <div class="card" id="requests-section">
                <div class="admin-section-header">
                    <h2>Access Requests</h2>
                    <span class="admin-count" id="requests-count">0</span>
                </div>
                <div id="requests-list"></div>
            </div>

            <!-- Users (collapsible) -->
            <details class="card admin-collapsible" id="users-section">
                <summary class="admin-section-toggle">
                    <div class="admin-section-header">
                        <h2>Users</h2>
                        <span class="admin-count" id="users-count">0</span>
                    </div>
                </summary>
                <div class="admin-collapsible-content" id="users-list"></div>
            </details>

            <a href="/" class="back-link">&larr; Back to Recipes</a>
        </div>
    </div>

    <script>
        const API_BASE = 'https://recipe-upload.lukelabonte.workers.dev';
        const SESSION_KEY = 'admin-secret';

        // ── Helpers ──────────────────────────────────────

        function getSecret() {
            return sessionStorage.getItem(SESSION_KEY);
        }

        async function api(method, path, body) {
            const headers = { 'X-Admin-Secret': getSecret() };
            if (body) headers['Content-Type'] = 'application/json';
            const opts = { method, headers };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(API_BASE + path, opts);
            let data;
            try {
                data = await res.json();
            } catch {
                data = { error: 'Unexpected response from server' };
            }
            return { status: res.status, data };
        }

        function relativeDate(iso) {
            const diff = Date.now() - new Date(iso).getTime();
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return 'just now';
            if (mins < 60) return mins + 'm ago';
            const hrs = Math.floor(mins / 60);
            if (hrs < 24) return hrs + 'h ago';
            const days = Math.floor(hrs / 24);
            if (days < 30) return days + 'd ago';
            return new Date(iso).toLocaleDateString();
        }

        function clearChildren(node) {
            while (node.firstChild) node.removeChild(node.firstChild);
        }

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text) node.textContent = text;
            return node;
        }

        // ── Auth ─────────────────────────────────────────

        const authGate = document.getElementById('auth-gate');
        const dashboard = document.getElementById('dashboard');
        const authForm = document.getElementById('auth-form');
        const authStatus = document.getElementById('auth-status');

        authForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const secret = document.getElementById('admin-secret').value.trim();
            if (!secret) return;

            authStatus.className = 'admin-status status-processing visible';
            authStatus.textContent = 'Verifying\u2026';
            this.querySelector('.submit-btn').disabled = true;

            sessionStorage.setItem(SESSION_KEY, secret);
            const ok = await tryAuth();
            if (!ok) {
                sessionStorage.removeItem(SESSION_KEY);
                authStatus.className = 'admin-status status-error visible';
                authStatus.textContent = 'Invalid admin secret.';
                this.querySelector('.submit-btn').disabled = false;
            }
        });

        async function tryAuth() {
            try {
                const res = await api('GET', '/admin/requests');
                if (res.status === 403 || res.status === 401) return false;
                if (res.status >= 400) return false;
                showDashboard(res.data.requests || []);
                return true;
            } catch {
                return false;
            }
        }

        // Check for existing session on load
        if (getSecret()) {
            tryAuth().then(ok => {
                if (!ok) sessionStorage.removeItem(SESSION_KEY);
            });
        }

        // ── Dashboard ────────────────────────────────────

        function showDashboard(requests) {
            authGate.style.display = 'none';
            dashboard.style.display = '';
            renderRequests(requests);
            // Fetch users in parallel
            api('GET', '/admin/users').then(res => {
                renderUsers(res.data.users || []);
            });
        }

        // Sign out
        document.getElementById('sign-out-btn').addEventListener('click', function() {
            sessionStorage.removeItem(SESSION_KEY);
            location.reload();
        });

        // ── Requests ─────────────────────────────────────

        function renderRequests(requests) {
            const list = document.getElementById('requests-list');
            clearChildren(list);

            requests.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            if (requests.length === 0) {
                list.appendChild(el('p', 'admin-empty', 'No pending requests'));
                updateCounts();
                return;
            }

            requests.forEach(req => {
                const card = el('div', 'admin-card');
                card.dataset.id = req.id;

                card.appendChild(el('div', 'admin-card-name', req.name));
                if (req.contact) card.appendChild(el('div', 'admin-card-contact', req.contact));
                if (req.message) card.appendChild(el('div', 'admin-card-message', '\u201C' + req.message + '\u201D'));
                if (req.createdAt) card.appendChild(el('div', 'admin-card-date', relativeDate(req.createdAt)));

                const buttons = el('div', 'admin-card-buttons');
                const approveBtn = el('button', 'admin-btn admin-btn-approve', 'Approve');
                const dismissBtn = el('button', 'admin-btn admin-btn-dismiss', 'Dismiss');
                buttons.appendChild(approveBtn);
                buttons.appendChild(dismissBtn);
                card.appendChild(buttons);

                approveBtn.addEventListener('click', () => handleApprove(req, card, approveBtn, dismissBtn));
                dismissBtn.addEventListener('click', () => handleDismiss(req, card, approveBtn, dismissBtn));

                list.appendChild(card);
            });

            updateCounts();
        }

        async function handleApprove(req, card, approveBtn, dismissBtn) {
            approveBtn.disabled = true;
            dismissBtn.disabled = true;
            approveBtn.textContent = 'Approving\u2026';

            try {
                const userRes = await api('POST', '/admin/users', {
                    displayName: req.name,
                    email: req.contact || undefined
                });

                if (userRes.status >= 400) {
                    showCardStatus(card, 'error', userRes.data.error || 'Failed to create user.');
                    approveBtn.disabled = false;
                    dismissBtn.disabled = false;
                    approveBtn.textContent = 'Approve';
                    return;
                }

                // Delete the request
                await api('DELETE', '/admin/requests/' + encodeURIComponent(req.id));

                // Show success
                const passphrase = userRes.data.passphrase;
                const emailSent = userRes.data.emailSent;

                function fadeOutCard() {
                    card.classList.add('admin-card-fading');
                    setTimeout(() => {
                        card.remove();
                        updateCounts();
                    }, 300);
                }

                if (emailSent) {
                    showCardStatus(card, 'success', 'Approved! Passphrase sent to ' + (req.contact || 'email') + '.');
                    // Auto-fade since nothing to copy
                    setTimeout(fadeOutCard, 3000);
                } else {
                    // Show passphrase with copy + dismiss buttons (no auto-fade)
                    const statusDiv = el('div', 'admin-card-status status-success');
                    statusDiv.appendChild(document.createTextNode('Approved! Passphrase: '));
                    const code = el('code', 'admin-card-passphrase', passphrase);
                    statusDiv.appendChild(code);
                    statusDiv.appendChild(document.createTextNode(' '));
                    const copyBtn = el('button', 'admin-btn admin-btn-copy', 'Copy');
                    copyBtn.addEventListener('click', () => copyToClipboard(passphrase, copyBtn));
                    statusDiv.appendChild(copyBtn);
                    statusDiv.appendChild(document.createTextNode(' '));
                    const doneBtn = el('button', 'admin-btn admin-btn-dismiss', 'Done');
                    doneBtn.addEventListener('click', fadeOutCard);
                    statusDiv.appendChild(doneBtn);
                    // Remove old buttons
                    const oldButtons = card.querySelector('.admin-card-buttons');
                    if (oldButtons) oldButtons.remove();
                    card.appendChild(statusDiv);
                }

                // Refresh users
                api('GET', '/admin/users').then(res => renderUsers(res.data.users || []));

            } catch (err) {
                showCardStatus(card, 'error', 'Network error. Please try again.');
                approveBtn.disabled = false;
                dismissBtn.disabled = false;
                approveBtn.textContent = 'Approve';
            }
        }

        async function handleDismiss(req, card, approveBtn, dismissBtn) {
            approveBtn.disabled = true;
            dismissBtn.disabled = true;
            dismissBtn.textContent = 'Dismissing\u2026';

            try {
                const res = await api('DELETE', '/admin/requests/' + encodeURIComponent(req.id));
                if (res.status >= 400) {
                    showCardStatus(card, 'error', res.data.error || 'Failed to dismiss.');
                    approveBtn.disabled = false;
                    dismissBtn.disabled = false;
                    dismissBtn.textContent = 'Dismiss';
                    return;
                }
                card.classList.add('admin-card-fading');
                setTimeout(() => {
                    card.remove();
                    updateCounts();
                }, 300);
            } catch {
                showCardStatus(card, 'error', 'Network error.');
                approveBtn.disabled = false;
                dismissBtn.disabled = false;
                dismissBtn.textContent = 'Dismiss';
            }
        }

        function showCardStatus(card, type, text) {
            let status = card.querySelector('.admin-card-status');
            if (!status) {
                status = el('div', 'admin-card-status');
                card.appendChild(status);
            }
            status.className = 'admin-card-status status-' + type;
            status.textContent = text;
        }

        // ── Users ────────────────────────────────────────

        function renderUsers(users) {
            const list = document.getElementById('users-list');
            clearChildren(list);

            users.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            if (users.length === 0) {
                list.appendChild(el('p', 'admin-empty', 'No users yet'));
                updateCounts();
                return;
            }

            users.forEach(user => {
                const card = el('div', 'admin-card');
                card.dataset.passphrase = user.passphrase;

                card.appendChild(el('div', 'admin-card-name', user.displayName));
                card.appendChild(el('div', 'admin-card-passphrase', user.passphrase));
                if (user.createdAt) card.appendChild(el('div', 'admin-card-date', relativeDate(user.createdAt)));

                const buttons = el('div', 'admin-card-buttons');
                const copyBtn = el('button', 'admin-btn admin-btn-copy', 'Copy Passphrase');
                copyBtn.addEventListener('click', () => copyToClipboard(user.passphrase, copyBtn));
                buttons.appendChild(copyBtn);

                const removeBtn = el('button', 'admin-btn admin-btn-remove', 'Remove');
                removeBtn.addEventListener('click', () => showRemoveConfirm(user, card));
                buttons.appendChild(removeBtn);

                card.appendChild(buttons);
                list.appendChild(card);
            });

            updateCounts();
        }

        function showRemoveConfirm(user, card) {
            // Toggle existing confirmation
            const existing = card.querySelector('.admin-confirm');
            if (existing) { existing.remove(); return; }

            const confirm = el('div', 'admin-confirm');
            confirm.appendChild(el('span', 'admin-confirm-text', 'Remove ' + user.displayName + '?'));

            const yesBtn = el('button', 'admin-confirm-yes', 'Yes, Remove');
            yesBtn.addEventListener('click', async () => {
                yesBtn.disabled = true;
                yesBtn.textContent = 'Removing\u2026';
                try {
                    const res = await api('DELETE', '/admin/users/' + encodeURIComponent(user.passphrase));
                    if (res.status >= 400) {
                        showCardStatus(card, 'error', res.data.error || 'Failed to remove.');
                        confirm.remove();
                        return;
                    }
                    card.classList.add('admin-card-fading');
                    setTimeout(() => {
                        card.remove();
                        updateCounts();
                    }, 300);
                } catch {
                    showCardStatus(card, 'error', 'Network error.');
                    confirm.remove();
                }
            });
            confirm.appendChild(yesBtn);

            const cancelBtn = el('button', 'admin-confirm-cancel', 'Cancel');
            cancelBtn.addEventListener('click', () => confirm.remove());
            confirm.appendChild(cancelBtn);

            card.appendChild(confirm);
        }

        // ── Clipboard ────────────────────────────────────

        function copyToClipboard(text, btn) {
            const original = btn.textContent;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    btn.textContent = 'Copied!';
                    setTimeout(() => { btn.textContent = original; }, 1500);
                }).catch(() => {
                    prompt('Copy this passphrase:', text);
                });
            } else {
                prompt('Copy this passphrase:', text);
            }
        }

        // ── Counts ───────────────────────────────────────

        function updateCounts() {
            const reqCards = document.querySelectorAll('#requests-list .admin-card:not(.admin-card-fading)');
            const userCards = document.querySelectorAll('#users-list .admin-card:not(.admin-card-fading)');
            const reqCount = reqCards.length;
            const userCount = userCards.length;

            document.getElementById('requests-count').textContent = reqCount;
            document.getElementById('users-count').textContent = userCount;

            const subtitle = document.getElementById('dashboard-subtitle');
            const parts = [];
            if (reqCount > 0) parts.push(reqCount + ' pending request' + (reqCount !== 1 ? 's' : ''));
            if (userCount > 0) parts.push(userCount + ' user' + (userCount !== 1 ? 's' : ''));
            subtitle.textContent = parts.length ? parts.join(' \u00B7 ') : 'No requests or users';

            // Show empty states if no cards remain
            const reqList = document.getElementById('requests-list');
            if (reqCount === 0 && !reqList.querySelector('.admin-empty')) {
                clearChildren(reqList);
                reqList.appendChild(el('p', 'admin-empty', 'No pending requests'));
            }
            const userList = document.getElementById('users-list');
            if (userCount === 0 && !userList.querySelector('.admin-empty')) {
                clearChildren(userList);
                userList.appendChild(el('p', 'admin-empty', 'No users yet'));
            }
        }
    </script>
</body>
</html>
