<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image optimization browser checks</title>
    <style>
        body { font: 16px system-ui; max-width: 1000px; margin: 20px auto; padding: 0 12px; background: #fff; color: #111; }
        pre { white-space: pre-wrap; overflow-wrap: anywhere; }
        .samples { display: flex; flex-wrap: wrap; gap: 20px; }
        canvas { max-width: 100%; border: 1px solid #aaa; }
        iframe { width: 100%; height: 650px; border: 1px solid #aaa; }
    </style>
</head>
<body>
    <h1>Image optimization browser checks</h1>
    <p>Local fixtures only. No production uploads. Compare the small quantities in both crops at native size.</p>
    <pre id="results" role="status">Measuring native browser encoding…</pre>
    <div class="samples" id="samples"></div>
    <button id="run" type="button" disabled>Run optimizer and upload checks</button>
    <div id="form-test"></div>
    <script type="module">
        const results = document.getElementById('results');
        const samples = document.getElementById('samples');
        const runButton = document.getElementById('run');
        const lines = [];
        function log(message) {
            lines.push(message);
            results.textContent = lines.join('\n');
        }
        function assert(condition, message) {
            if (!condition) throw new Error(message);
        }
        function encode(canvas, type, quality) {
            return new Promise((resolve, reject) => canvas.toBlob(
                (blob) => blob ? resolve(blob) : reject(new Error('Encoder returned null')), type, quality
            ));
        }
        function crop(image, label) {
            const container = document.createElement('div');
            const heading = document.createElement('h2');
            heading.textContent = label;
            const canvas = document.createElement('canvas');
            canvas.width = 480;
            canvas.height = 180;
            canvas.getContext('2d').drawImage(image, 40, 40, 480, 180, 0, 0, 480, 180);
            container.append(heading, canvas);
            samples.append(container);
        }
        // Deterministic photo-like noise behind a small text panel keeps this PNG genuinely large.
        const source = document.createElement('canvas');
        source.width = 2800;
        source.height = 2200;
        const context = source.getContext('2d');
        const pixels = context.createImageData(source.width, source.height);
        let seed = 2718;
        for (let index = 0; index < pixels.data.length; index += 4) {
            seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
            pixels.data[index] = seed & 255;
            pixels.data[index + 1] = (seed >>> 8) & 255;
            pixels.data[index + 2] = (seed >>> 16) & 255;
            pixels.data[index + 3] = 255;
        }
        context.putImageData(pixels, 0, 0);
        context.fillStyle = '#fff';
        context.fillRect(40, 40, 600, 240);
        context.fillStyle = '#111';
        context.font = '16px sans-serif';
        ['½ tsp salt', '¼ cup sugar', '1½ tbsp oil', 'Bake at 350°F for 12–15 min.', '0.5 g yeast; 100 g flour'].forEach(
            (line, index) => context.fillText(line, 55, 70 + index * 28)
        );
        crop(source, 'Original text');
        const started = performance.now();
        const png = await encode(source, 'image/png');
        const webp = await encode(source, 'image/webp', 0.95);
        const decoded = await createImageBitmap(webp);
        crop(decoded, 'WebP quality 0.95');
        decoded.close();
        log(`Browser: ${navigator.userAgent}`);
        log(`Fixture: ${source.width} × ${source.height}; PNG ${png.size} bytes; WebP ${webp.size} bytes (${webp.type}).`);
        log(`Native encoding probe: ${Math.round(performance.now() - started)} ms. Settings are not yet verified on iPhone Safari.`);
        assert(png.size > 7_500_000, 'The source fixture must actually exceed the upload limit');
        window.fixture = { png, webp, source, log, assert, encode, crop };
        runButton.disabled = false;

        function waitFor(predicate, target = document.body) {
            if (predicate()) return Promise.resolve();
            return new Promise((resolve, reject) => {
                const timer = setTimeout(() => {
                    observer.disconnect();
                    reject(new Error('Timed out waiting for page state'));
                }, 30_000);
                const observer = new MutationObserver(() => {
                    if (!predicate()) return;
                    clearTimeout(timer);
                    observer.disconnect();
                    resolve();
                });
                observer.observe(target, { attributes: true, childList: true, subtree: true, characterData: true });
            });
        }

        function crc32(bytes) {
            let crc = 0xffffffff;
            for (const byte of bytes) {
                crc ^= byte;
                for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ (crc & 1 ? 0xedb88320 : 0);
            }
            return (crc ^ 0xffffffff) >>> 0;
        }

        function paddedPng(blob) {
            const padding = new Uint8Array(7_500_012);
            const view = new DataView(padding.buffer);
            view.setUint32(0, 7_500_000);
            padding.set(new TextEncoder().encode('npAD'), 4);
            view.setUint32(padding.length - 4, crc32(padding.subarray(4, padding.length - 4)));
            return new File([blob.slice(0, -12), padding, blob.slice(-12)], 'transparent.png', { type: 'image/png' });
        }

        async function pixelAt(blob, x, y) {
            const bitmap = await createImageBitmap(blob);
            const canvas = document.createElement('canvas');
            canvas.width = bitmap.width;
            canvas.height = bitmap.height;
            const drawing = canvas.getContext('2d');
            drawing.drawImage(bitmap, 0, 0);
            bitmap.close();
            return drawing.getImageData(x, y, 1, 1).data;
        }

        runButton.addEventListener('click', async () => {
            runButton.disabled = true;
            try {
                const { inspectImage, optimizeImage } = await import('../../../assets/image-optimizer.js');
                const original = new File([png], 'recipe-screenshot.png', { type: 'image/png' });
                const started = performance.now();
                const optimized = await optimizeImage(original);
                assert(optimized.size > 0 && optimized.size <= 7_500_000, 'Optimized bytes must fit');
                const metadata = await inspectImage(optimized);
                assert(metadata.width === source.width && metadata.height === source.height, 'High-quality same-size encoding should fit this fixture');
                const bitmap = await createImageBitmap(optimized);
                crop(bitmap, 'Actual optimizer output');
                bitmap.close();
                log(`PASS native optimizer: ${original.size} → ${optimized.size} bytes, ${optimized.type}, ${Math.round(performance.now() - started)} ms.`);

                const transparent = document.createElement('canvas');
                transparent.width = 200;
                transparent.height = 100;
                transparent.getContext('2d').fillText('½ tsp salt', 40, 50);
                const smallPng = await encode(transparent, 'image/png');
                const padded = paddedPng(smallPng);
                const transparentResult = await optimizeImage(padded);
                assert((await pixelAt(transparentResult, 0, 0))[3] === 0, 'PNG alpha must survive');
                log('PASS transparent PNG and lossless-first encoding.');

                const nativeToBlob = HTMLCanvasElement.prototype.toBlob;
                let jpegResult;
                try {
                    HTMLCanvasElement.prototype.toBlob = function(callback, type, quality) {
                        if (type !== 'image/jpeg') queueMicrotask(() => callback(null));
                        else nativeToBlob.call(this, callback, type, quality);
                    };
                    jpegResult = await optimizeImage(padded);
                } finally {
                    HTMLCanvasElement.prototype.toBlob = nativeToBlob;
                }
                const white = await pixelAt(jpegResult, 0, 0);
                assert(jpegResult.type === 'image/jpeg' && white[0] >= 250 && white[1] >= 250 && white[2] >= 250,
                    'JPEG must composite transparent pixels against white');
                log('PASS native JPEG fallback uses a white background.');

                const photo = document.createElement('canvas');
                photo.width = 180;
                photo.height = 90;
                const photoContext = photo.getContext('2d');
                photoContext.fillStyle = '#00f';
                photoContext.fillRect(0, 0, 180, 90);
                photoContext.fillStyle = '#f00';
                photoContext.fillRect(0, 0, 30, 30);
                const jpeg = await encode(photo, 'image/jpeg', 0.95);
                const exif = Uint8Array.of(255, 225, 0, 34, 69, 120, 105, 102, 0, 0,
                    73, 73, 42, 0, 8, 0, 0, 0, 1, 0, 18, 1, 3, 0, 1, 0, 0, 0, 6, 0, 0, 0, 0, 0, 0, 0);
                const paddingSegment = new Uint8Array(65537);
                paddingSegment.set([255, 239, 255, 255]);
                const rotated = new File([jpeg.slice(0, 2), exif, ...Array(120).fill(paddingSegment), jpeg.slice(2)],
                    'rotated.jpg', { type: 'image/jpeg' });
                const rotatedResult = await optimizeImage(rotated);
                const rotatedMetadata = await inspectImage(rotatedResult);
                const red = await pixelAt(rotatedResult, 75, 15);
                assert(rotatedMetadata.width === 90 && rotatedMetadata.height === 180 && red[0] > 200 && red[2] < 30,
                    'EXIF orientation must survive as correctly rotated pixels');
                log('PASS rotated JPEG dimensions and pixel orientation.');

                const frame = document.createElement('iframe');
                frame.title = 'Local upload form integration';
                const loaded = new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
                frame.src = '/upload';
                document.getElementById('form-test').append(frame);
                await loaded;
                const page = frame.contentWindow;
                const formDocument = frame.contentDocument;
                const input = formDocument.getElementById('image');
                const button = formDocument.getElementById('file-optimize');
                const preview = formDocument.getElementById('file-preview');
                const requests = [];
                page.fetch = async (url, options) => {
                    requests.push(options.body);
                    return Response.json({ error: 'Local browser check. Nothing was uploaded.' }, { status: 401 });
                };
                const selectFile = (file) => {
                    const transfer = new page.DataTransfer();
                    transfer.items.add(file);
                    input.files = transfer.files;
                    input.dispatchEvent(new page.Event('change', { bubbles: true }));
                };
                selectFile(padded);
                await waitFor(() => !button.hidden, formDocument.body);
                button.click();
                await waitFor(() => !preview.hidden, formDocument.body);
                assert(requests.length === 0, 'Optimization must not submit');
                formDocument.getElementById('file-restore').click();
                assert(preview.hidden && formDocument.getElementById('file-error').textContent.includes('too large'),
                    'Restore must reinstate the size warning');
                await waitFor(() => !button.hidden, formDocument.body);
                button.click();
                await waitFor(() => !preview.hidden, formDocument.body);
                formDocument.getElementById('passphrase').value = 'browser-test-only';
                formDocument.getElementById('recipe').value = 'Simmer test vegetables.';
                formDocument.getElementById('upload-form').requestSubmit();
                await waitFor(() => !formDocument.querySelector('.submit-btn').disabled, formDocument.body);
                assert(requests.length === 1 && requests[0].getAll('image').length === 1, 'Send only one attachment');
                const sentFile = requests[0].get('image');
                assert(sentFile.size <= 7_500_000 && sentFile.name.includes('-optimized.'), 'Send the optimized copy');
                assert(requests[0].get('text') === 'Simmer test vegetables.', 'Preserve recipe fields');
                log('PASS real form: explicit preparation, preview, restore, and one optimized attachment; no real fetch.');

                selectFile(padded);
                await waitFor(() => !button.hidden, formDocument.body);
                button.click();
                selectFile(new File([smallPng], 'replacement.png', { type: 'image/png' }));
                await waitFor(() => !button.disabled, formDocument.body);
                assert(preview.hidden && formDocument.getElementById('file-text').textContent === 'replacement.png',
                    'Replacement must discard the previous preparation result');
                log('PASS real form: replacement during preparation discards stale results.');
                log('ALL BROWSER CHECKS PASSED. iPhone Safari remains a separate release gate.');
            } catch (error) {
                log(`FAIL: ${error.stack || error.message}`);
            } finally {
                runButton.disabled = false;
            }
        });
    </script>
</body>
</html>
