<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Access</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
    <meta property="og:title" content="Request Access">
    <meta property="og:description" content="Request a passphrase to contribute recipes.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://lukelabonte.github.io/food-recipes/assets/thumbnails/index.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://lukelabonte.github.io/food-recipes/request-access">
    <style>
        .request-page {
            max-width: 640px;
            margin: 0 auto;
        }
        .request-page .header-card {
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            margin-bottom: 0.65rem;
        }

        /* Form layout */
        .form-group { margin-bottom: 1.25rem; }
        .form-group:last-child { margin-bottom: 0; }
        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #3d3d3d;
            margin-bottom: 0.35rem;
        }
        .form-label .optional {
            font-weight: 400;
            color: #bbb;
            font-size: 0.8rem;
        }

        /* Inputs and textareas */
        .form-input,
        .form-textarea {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1px solid #e0d6c8;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #3d3d3d;
            background: #faf8f5;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            -webkit-appearance: none;
            min-height: 44px;
        }
        .form-input::placeholder,
        .form-textarea::placeholder { color: #c4b8a8; }
        .form-input:focus,
        .form-textarea:focus {
            border-color: #9a7b5b;
            box-shadow: 0 0 0 3px rgba(154, 123, 91, 0.12);
        }
        .form-textarea {
            resize: vertical;
            min-height: 120px;
            line-height: 1.5;
        }

        /* Submit button */
        .submit-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.75rem 1.5rem;
            background: #9a7b5b;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s ease;
            min-height: 48px;
            -webkit-tap-highlight-color: rgba(0,0,0,0.05);
        }
        .submit-btn:hover { background: #7a5f43; }
        .submit-btn:active { opacity: 0.85; }

        /* Status feedback */
        #request-status {
            margin-top: 0.75rem;
            padding: 0.65rem 0.85rem;
            border-radius: 10px;
            font-size: 0.88rem;
            line-height: 1.45;
            display: none;
        }
        #request-status.visible { display: block; }
        .status-success {
            background: #f0f9f0;
            color: #3a7d3a;
            border: 1px solid #c8e6c8;
        }
        .status-error {
            background: #fdf0f0;
            color: #c44;
            border: 1px solid #f0c8c8;
        }
        .status-processing {
            background: #f5f3f0;
            color: #888;
            border: 1px solid #e0d6c8;
        }

        /* Actions row */
        .request-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0.25rem;
            margin-bottom: 0.75rem;
        }
        .request-actions a {
            font-size: 0.9rem;
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .form-input,
            .form-textarea,
            .submit-btn { transition: none; }
        }

        /* Print: hide everything */
        @media print {
            body { display: none; }
        }
    </style>
</head>
<body>
    <div class="request-page">
        <div class="card header-card">
            <h1>Request Access</h1>
            <p class="subtitle">Want to contribute? Let us know and we'll reach out.</p>
        </div>

        <div class="request-actions">
            <a href="/" class="back-link" style="padding:0;">&larr; Back to Recipes</a>
            <a href="upload" class="back-link" style="padding:0;">Already have a passphrase? &rarr;</a>
        </div>

        <form id="request-form" class="card" action="https://recipe-upload.lukelabonte.workers.dev/request-access" method="POST">
            <div class="form-group">
                <label class="form-label" for="req-name">Name</label>
                <input class="form-input" type="text" id="req-name" name="name" required placeholder="Your name">
            </div>

            <div class="form-group">
                <label class="form-label" for="req-contact">Email or contact</label>
                <input class="form-input" type="text" id="req-contact" name="contact" required placeholder="How to reach you">
            </div>

            <div class="form-group">
                <label class="form-label" for="req-message">Message <span class="optional">(optional)</span></label>
                <textarea class="form-textarea" id="req-message" name="message" placeholder="Anything you'd like us to know..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Request</button>
            <div id="request-status"></div>
        </form>

        <a href="/" class="back-link">&larr; Back to Recipes</a>
    </div>

    <script>
        document.getElementById('request-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const status = document.getElementById('request-status');
            const submitBtn = this.querySelector('.submit-btn');

            status.className = 'status-processing visible';
            status.textContent = 'Sending your request\u2026';
            submitBtn.disabled = true;

            try {
                const response = await fetch(this.action, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('req-name').value,
                        contact: document.getElementById('req-contact').value,
                        message: document.getElementById('req-message').value
                    })
                });
                const data = await response.json();

                if (response.ok) {
                    status.className = 'status-success visible';
                    status.textContent = '\u2713 Request sent! We\u2019ll be in touch.';
                    this.reset();
                } else {
                    status.className = 'status-error visible';
                    status.textContent = data.error || 'Something went wrong. Please try again.';
                }
            } catch (err) {
                status.className = 'status-error visible';
                status.textContent = 'Network error. Please check your connection and try again.';
            }

            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Request';
        });
    </script>
</body>
</html>
