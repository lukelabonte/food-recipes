<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload a Recipe</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📤</text></svg>">
    <meta property="og:title" content="Upload a Recipe">
    <meta property="og:description" content="Add your recipe to the family collection.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://lukelabonte.github.io/food-recipes/assets/thumbnails/index.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://lukelabonte.github.io/food-recipes/upload.html">
    <style>
        .upload-page {
            max-width: 640px;
            margin: 0 auto;
        }
        .upload-page .header-card {
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            margin-bottom: 0.65rem;
        }

        /* Form layout */
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group:last-child {
            margin-bottom: 0;
        }
        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #3d3d3d;
            margin-bottom: 0.35rem;
        }
        .form-label .optional {
            font-weight: 400;
            color: #bbb;
            font-size: 0.8rem;
        }

        /* Inputs and textareas */
        .form-input,
        .form-textarea {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1px solid #e0d6c8;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #3d3d3d;
            background: #faf8f5;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            -webkit-appearance: none;
            min-height: 44px;
        }
        .form-input::placeholder,
        .form-textarea::placeholder {
            color: #c4b8a8;
        }
        .form-input:focus,
        .form-textarea:focus {
            border-color: #9a7b5b;
            box-shadow: 0 0 0 3px rgba(154, 123, 91, 0.12);
        }
        .form-textarea {
            resize: vertical;
            min-height: 120px;
            line-height: 1.5;
        }
        .form-textarea.recipe-input {
            min-height: 200px;
        }

        /* Helper text */
        .form-helper {
            font-size: 0.78rem;
            color: #aaa;
            font-style: italic;
            margin-top: 0.35rem;
            line-height: 1.4;
        }

        /* File input */
        .file-input-wrapper {
            position: relative;
        }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            width: 0;
            height: 0;
            opacity: 0;
            pointer-events: none;
        }
        .file-input-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.65rem 0.85rem;
            border: 1px dashed #d8cfc2;
            border-radius: 10px;
            background: #faf8f5;
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease;
            min-height: 44px;
        }
        .file-input-label:hover {
            border-color: #c4a882;
            background: #f5f0ea;
        }
        .file-input-label.has-file {
            border-color: #9a7b5b;
            border-style: solid;
            background: #f5f0ea;
        }
        .file-input-icon {
            width: 20px;
            height: 20px;
            color: #bbb;
            flex-shrink: 0;
        }
        .file-input-text {
            font-size: 0.9rem;
            color: #c4b8a8;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-input-label.has-file .file-input-text {
            color: #3d3d3d;
        }
        .file-input-clear {
            background: none;
            border: none;
            color: #bbb;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0.2rem;
            line-height: 1;
            display: none;
        }
        .file-input-label.has-file .file-input-clear {
            display: block;
        }
        .file-input-clear:hover {
            color: #888;
        }

        /* Submit button */
        .submit-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            width: 100%;
            padding: 0.75rem 1.5rem;
            background: #9a7b5b;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s ease;
            min-height: 48px;
            -webkit-tap-highlight-color: rgba(0,0,0,0.05);
        }
        .submit-btn:hover {
            background: #7a5f43;
        }
        .submit-btn:active {
            opacity: 0.85;
        }

        /* Status feedback */
        #upload-status {
            margin-top: 0.75rem;
            padding: 0.65rem 0.85rem;
            border-radius: 10px;
            font-size: 0.88rem;
            line-height: 1.45;
            display: none;
        }
        #upload-status.visible {
            display: block;
        }
        .status-success {
            background: #f0f9f0;
            color: #3a7d3a;
            border: 1px solid #c8e6c8;
        }
        .status-error {
            background: #fdf0f0;
            color: #c44;
            border: 1px solid #f0c8c8;
        }
        .status-processing {
            background: #f5f3f0;
            color: #888;
            border: 1px solid #e0d6c8;
        }

        /* Back link spacing */
        .upload-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0.25rem;
            margin-bottom: 0.75rem;
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .form-input,
            .form-textarea,
            .file-input-label,
            .submit-btn {
                transition: none;
            }
        }

        /* Print: hide everything */
        @media print {
            body { display: none; }
        }
    </style>
</head>
<body>
    <div class="upload-page">
        <div class="card header-card">
            <h1>Upload a Recipe</h1>
            <p class="subtitle">Add your recipe to the collection</p>
        </div>

        <div class="upload-actions">
            <a href="index.html" class="back-link" style="padding:0; font-size:0.9rem;">&larr; Back to Recipes</a>
            <a href="request-access.html" style="font-size:0.88rem; color:#9a7b5b;">Don't have a passphrase?</a>
        </div>

        <!-- Upload form -->
        <form id="upload-form" class="card" action="https://recipe-upload.lukelabonte.workers.dev/upload" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label class="form-label" for="passphrase">Passphrase</label>
                <input class="form-input" type="text" id="passphrase" name="passphrase" required autocomplete="off" placeholder="Enter your passphrase">
            </div>

            <div class="form-group">
                <label class="form-label" for="recipe">Recipe</label>
                <textarea class="form-textarea recipe-input" id="recipe" name="text" required placeholder="Paste your recipe, type it out, or describe it..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="url">URL <span class="optional">(optional)</span></label>
                <input class="form-input" type="url" id="url" name="url" placeholder="https://example.com/recipe">
            </div>

            <div class="form-group">
                <label class="form-label" for="image">Photo or file <span class="optional">(optional)</span></label>
                <div class="file-input-wrapper">
                    <input type="file" id="image" name="image" accept="image/*,.pdf">
                    <label class="file-input-label" for="image" id="file-label">
                        <svg class="file-input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M18.375 12.739l-7.693 7.693a4.5 4.5 0 01-6.364-6.364l10.94-10.94A3 3 0 1119.5 7.372L8.552 18.32m.009-.01l-.01.01m5.699-9.941l-7.81 7.81a1.5 1.5 0 002.112 2.13" />
                        </svg>
                        <span class="file-input-text" id="file-text">Choose a photo or PDF...</span>
                        <button type="button" class="file-input-clear" id="file-clear" aria-label="Remove file">&times;</button>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="notes">Notes <span class="optional">(optional)</span></label>
                <textarea class="form-textarea" id="notes" name="notes" placeholder="Any context for processing this recipe..."></textarea>
                <p class="form-helper">e.g., "This is my mom's recipe, she eyeballs the measurements so the amounts are approximate" or "We usually double the garlic"</p>
            </div>

            <div class="form-group">
                <label class="form-label" for="recipe-from">Recipe from <span class="optional">(optional)</span></label>
                <input class="form-input" type="text" id="recipe-from" name="recipeFrom" placeholder="Defaults to your name">
            </div>

            <button type="submit" class="submit-btn">Upload Recipe</button>
            <div id="upload-status"></div>
        </form>

        <a href="index.html" class="back-link">&larr; Back to Recipes</a>
    </div>

    <script>
        // File input UI
        const fileInput = document.getElementById('image');
        const fileLabel = document.getElementById('file-label');
        const fileText = document.getElementById('file-text');
        const fileClear = document.getElementById('file-clear');

        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                fileText.textContent = this.files[0].name;
                fileLabel.classList.add('has-file');
            } else {
                resetFileInput();
            }
        });

        fileClear.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            fileInput.value = '';
            resetFileInput();
        });

        function resetFileInput() {
            fileText.textContent = 'Choose a photo or PDF...';
            fileLabel.classList.remove('has-file');
        }

        // Upload form
        document.getElementById('upload-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const status = document.getElementById('upload-status');
            const submitBtn = this.querySelector('.submit-btn');

            status.className = 'status-processing visible';
            status.textContent = 'Uploading and processing your recipe\u2026 This may take a minute.';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing\u2026';

            try {
                const formData = new FormData(this);
                const response = await fetch(this.action, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (response.ok && data.status === 'complete') {
                    status.className = 'status-success visible';
                    status.textContent = '';
                    status.appendChild(document.createTextNode('\u2713 '));
                    const strong = document.createElement('strong');
                    strong.textContent = data.title;
                    status.appendChild(strong);
                    status.appendChild(document.createTextNode(' uploaded! '));
                    const link = document.createElement('a');
                    link.href = data.prUrl;
                    link.target = '_blank';
                    link.rel = 'noopener';
                    link.textContent = 'View PR \u2192';
                    status.appendChild(link);
                    this.reset();
                    resetFileInput();
                } else {
                    status.className = 'status-error visible';
                    status.textContent = data.error || 'Something went wrong. Please try again.';
                }
            } catch (err) {
                status.className = 'status-error visible';
                status.textContent = 'Network error. Please check your connection and try again.';
            }

            submitBtn.disabled = false;
            submitBtn.textContent = 'Upload Recipe';
        });

    </script>
</body>
</html>
